name: nm_pos
description: "Mobile POS & Inventory Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: any

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.4
  sqflite: ^2.3.3+1

  # PostgreSQL client (MUST be inside dependencies)
  postgres: ^3.5.0

  # Crypto for password hashing (SHA-256)
  crypto: ^3.0.3

  # Networking
  http: ^1.2.2

  # Scanner
  mobile_scanner: ^5.2.3

  # Auth UI
  pinput: ^5.0.1
  intl_phone_field: ^3.2.0

  # Utils
  uuid: ^4.5.1
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo.png

dependency_overrides:
  path_provider_foundation: 2.4.2